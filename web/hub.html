<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProcWatch 控制台</title>
<style>
  :root{--bg:#0e1116;--panel:#151a21;--panel2:#1b2129;--line:#252c36;--fg:#e6edf3;
        --dim:#8b97a5;--dim2:#5f6b7a;--acc:#5aa9ff;--susp:#ff5c5c;--ok:#34d399;--warn:#f0a030}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;
       font:13px/1.5 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif}
  header{padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:16px}.brand span{color:var(--acc)}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
        padding:3px 11px;color:var(--dim);font-size:12px}
  .chip b{color:var(--fg)}
  .wrap{padding:18px 22px}
  .hint{color:var(--dim2);font-size:12px;margin-bottom:14px}
  table{border-collapse:separate;border-spacing:0;width:100%;background:var(--panel);
        border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th{background:var(--panel2);color:var(--dim);text-align:left;font-weight:600;
     padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px}
  td{padding:9px 14px;border-bottom:1px solid #1c222a}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#1a2129}
  .mono{font-family:"Cascadia Mono",Consolas,monospace}
  a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
         border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  button:hover{border-color:#3a4553;background:#222a34}
  .empty{color:var(--dim2);padding:34px;text-align:center}
  .badge{font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid #2b333e;color:var(--dim)}
  .badge.susp{color:var(--susp);border-color:#5a2020;background:#2c1414;font-weight:600}
  .badge.live{color:var(--ok);border-color:#1c4a38;background:#0f2a20}
  .dead{opacity:.5}
</style>
</head>
<body>
<header>
  <div class="brand">Proc<span>Watch</span> 控制台</div>
  <div class="chip">已监控进程 <b id="n">0</b></div>
  <div class="chip">事件合计 <b id="tot">0</b></div>
  <div class="chip">可疑合计 <b id="susp" style="color:var(--susp)">0</b></div>
  <div style="flex:1"></div>
  <button id="refresh">立即刷新</button>
</header>
<div class="wrap">
  <div class="hint">这里列出所有已注入 ProcWatch 的进程。点击"打开 WebUI"查看该进程的实时行为；"停用"会还原该进程的所有挂钩。</div>
  <table>
    <thead><tr>
      <th style="width:80px">PID</th>
      <th>进程</th>
      <th style="width:90px">端口</th>
      <th style="width:110px">事件</th>
      <th style="width:100px">可疑</th>
      <th style="width:120px">运行时长</th>
      <th style="width:120px">状态</th>
      <th style="width:210px">操作</th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="8" class="empty">正在扫描…</td></tr></tbody>
  </table>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function dur(ms) {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return (h ? h + " 时 " : "") + (m ? m + " 分 " : "") + (s % 60) + " 秒";
}

async function tick() {
  let list = [];
  try { list = await (await fetch("/api/list")).json(); } catch (e) { }
  const body = $("rows");
  if (!list.length) {
    body.innerHTML = '<tr><td colspan="8" class="empty">没有发现已注入的进程。用 <span class="mono">injector.exe</span> 启动或注入一个目标程序。</td></tr>';
    $("n").textContent = 0; $("tot").textContent = 0; $("susp").textContent = 0;
    return;
  }
  let tot = 0, sp = 0;
  body.innerHTML = list.map(it => {
    tot += it.events || 0; sp += it.suspect || 0;
    const live = it.alive;
    const href = "http://127.0.0.1:" + it.port + "/";
    return '<tr class="' + (live ? "" : "dead") + '">'
      + '<td class="mono">' + it.pid + '</td>'
      + '<td>' + esc(it.exe) + (it.title ? ' <span class="badge">' + esc(it.title) + '</span>' : '') + '</td>'
      + '<td class="mono">' + it.port + '</td>'
      + '<td class="mono">' + (it.events || 0) + '</td>'
      + '<td class="mono">' + (it.suspect ? '<span class="badge susp">' + it.suspect + '</span>' : "0") + '</td>'
      + '<td class="mono">' + dur(it.uptimeMs || 0) + '</td>'
      + '<td>' + (live ? '<span class="badge live">运行中</span>' : '<span class="badge">已退出</span>') + '</td>'
      + '<td>' + (live
          ? '<a href="' + href + '" target="_blank"><button>打开 WebUI</button></a> '
            + '<button onclick="deact(' + it.pid + ')">停用</button>'
          : '<button onclick="forget(' + it.pid + ')">清除记录</button>')
      + '</td></tr>';
  }).join("");
  $("n").textContent = list.length;
  $("tot").textContent = tot;
  $("susp").textContent = sp;
}

async function deact(pid) {
  if (!confirm("停用 PID " + pid + " 的监控？\n将还原该进程内所有被改写的导入/导出表，监控停止。")) return;
  await fetch("/api/deactivate?pid=" + pid, { method: "POST" });
  tick();
}
async function forget(pid) { await fetch("/api/forget?pid=" + pid, { method: "POST" }); tick(); }
$("refresh").onclick = tick;
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
